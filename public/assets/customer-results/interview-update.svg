<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
<title id="title">From applications to interview invitations</title>
<desc id="desc">An anonymous Scout Human Assistant customer wrote: Hi both got a few interviews coming up so well done. Their shared invitation includes: you have been selected for interview. Excerpts transcribed with identifying details omitted.</desc>
<rect width="1080" height="1080" fill="#fff7eb"/>
<g transform="translate(58 48) scale(2)"><path fill="#9dde47" d="M4.5 9.2c0-1.2 1.2-2 2.3-1.6l6.7 2.7v12.8l-6.7 2.7a1.7 1.7 0 0 1-2.3-1.6v-15Z"/><path fill="#10210d" d="m15.9 8.8 9.2-3.7c1.1-.5 2.4.4 2.4 1.6v18.6c0 1.2-1.3 2.1-2.4 1.6l-8.6-3.4V13.3l-1.2-.5c-1.8-.7-1.7-3.2.1-3.8l.5-.2Z"/></g>
<g font-family="Arial, sans-serif" fill="#10210d">
<text x="128" y="99" font-size="48" font-weight="700" letter-spacing="-2">scout</text>
<text x="1016" y="90" text-anchor="end" font-size="19" letter-spacing="2" font-weight="700">CUSTOMER UPDATE</text>
<text x="64" y="205" font-size="65" font-weight="700" letter-spacing="-2">From applications to</text>
<text x="64" y="278" font-size="65" font-weight="700" letter-spacing="-2">interview invitations.</text>
<rect x="64" y="324" width="952" height="310" rx="28" fill="#10210d"/>
<text x="100" y="376" font-size="18" font-weight="700" letter-spacing="2" fill="#b4ef6f">HUMAN ASSISTANT · CUSTOMER MESSAGE</text>
<text x="100" y="449" font-size="45" font-weight="700" fill="#ffffff">“Hi both got a few interviews</text>
<text x="100" y="509" font-size="45" font-weight="700" fill="#ffffff">coming up so well done”</text>
<text x="100" y="587" font-size="23" fill="#d4dfcf">Scout Human Assistant customer · via WhatsApp</text>
<rect x="64" y="666" width="952" height="226" rx="24" fill="#e7ffd2"/>
<text x="100" y="714" font-size="18" letter-spacing="2" font-weight="700">FROM THEIR INTERVIEW INVITATION</text>
<text x="100" y="772" font-size="37" font-weight="700">“you have been selected for interview.”</text>
<text x="100" y="825" font-size="21" fill="#3d4a35">Transcribed excerpt. Identifying details omitted.</text>
<text x="64" y="945" font-size="24" font-weight="700">Dedicated application support. Updates through WhatsApp.</text>
<text x="64" y="994" font-size="18" fill="#69735f">One customer’s experience. Interview outcomes vary.</text>
<text x="1016" y="1040" text-anchor="end" font-size="24" font-weight="700">applyscout.app</text>
